name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      # Caches OGP image scrapes and Fusic author lookups (see
      # lib/fetchers/base_fetcher.rb) so unchanged articles aren't
      # re-scraped on every scheduled rebuild.
      - uses: actions/cache@v4
        with:
          path: .bridgetown-cache
          key: bridgetown-content-cache-${{ github.run_id }}
          restore-keys: |
            bridgetown-content-cache-

      # `bridgetown build` only generates HTML from src/ - it does not run
      # esbuild, so CSS/JS must be built explicitly first or asset_path()
      # emits an unresolved "MISSING_ESBUILD_ASSET" placeholder.
      - name: Build frontend assets
        run: bin/bridgetown frontend:build

      - name: Build site
        run: bundle exec bridgetown build
        env:
          BRIDGETOWN_ENV: production

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: aws s3 sync output/ "s3://${{ secrets.SITE_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
